name: WinUI modernization
on:
  push:
    branches: [master, 'codex/**']
    paths: ['src/**', 'tests/**', 'scripts/**', '.github/workflows/winui.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', '.github/workflows/winui.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and run file-operation regressions
        run: dotnet run --project tests/Files.Core.Tests -c Release
  windows:
    runs-on: windows-2025
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and publish the WinUI application
        run: >-
          dotnet publish src/Files.WinUI/Files.WinUI.csproj -c Release
          -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }}
          -o artifacts/${{ matrix.rid }}
      - name: Verify x64 application startup
        if: matrix.platform == 'x64'
        shell: pwsh
        run: ./scripts/smoke-test-winui.ps1 -PublishDirectory ./artifacts/win-x64
      - name: Upload portable application folder
        uses: actions/upload-artifact@v4
        with:
          name: Files-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/
          if-no-files-found: error
